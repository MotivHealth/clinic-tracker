<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galston Clinic Tracker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F7F7F5;--surface:#FFFFFF;--border:#E4E4E0;--text-1:#1A1A18;--text-2:#5A5A56;--text-3:#9A9A96;--galston:#3266AD;--bot:#D85A30;--radius:8px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:var(--bg);font-family:var(--font);color:var(--text-1);font-size:14px}
.app{max-width:1040px;margin:0 auto;padding:24px 16px 60px}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px}
.hdr h1{font-size:20px;font-weight:600;letter-spacing:-.3px}
.hdr-sub{font-size:12px;color:var(--text-2);margin-top:3px}
.scan-btn{flex-shrink:0;padding:7px 16px;font-size:12px;font-weight:500;background:var(--text-1);color:#fff;border:none;border-radius:20px;cursor:pointer;white-space:nowrap}
.scan-btn:disabled{opacity:.4;cursor:default}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.pill{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:500;border:1.5px solid;display:inline-flex;align-items:center;gap:5px}
.pill-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;gap:0}
.tab{padding:9px 18px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab.active{color:var(--text-1);border-bottom-color:var(--text-1)}
.panel{display:none}
.panel.active{display:block}
.week-block{margin-bottom:28px}
.week-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.week-title{font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px}
.badge-current{background:#E6F1FB;color:#1A4A8C}
.badge-future{background:#EDF7ED;color:#1A5C1A}
.badge-past{background:#F2F2F0;color:#666}
.scan-info{font-size:10px;color:var(--text-3)}
.future-note{font-size:11px;color:var(--text-3);font-style:italic;margin-bottom:14px;line-height:1.5}
.grid{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px}
.grid-row{display:grid;border-bottom:1px solid var(--border)}
.grid-row:last-child{border-bottom:none}
.grid-row.hrow{background:var(--bg)}
.cell{padding:7px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50px}
.name-cell{align-items:flex-start;padding:8px 12px;min-width:0}
.pname{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.prole{font-size:9px;color:var(--text-3);margin-top:1px}
.dhdr{font-size:9px;font-weight:700;color:var(--text-2);text-align:center;text-transform:uppercase;letter-spacing:.04em;line-height:1.3}
.occ{font-size:12px;font-weight:700}
.osub{font-size:9px;color:var(--text-3);margin-top:1px}
.obar{width:78%;height:3px;background:var(--border);border-radius:2px;margin-top:3px;overflow:hidden}
.ofill{height:100%;border-radius:2px}
.dash{font-size:12px;color:var(--text-3)}
.clinic-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cname{font-size:13px;font-weight:600}
.cocc{font-size:12px;color:var(--text-2)}
.clinic-block{margin-bottom:20px}
.vel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:12px}
.vel h3{font-size:10px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.vel-row{display:grid;grid-template-columns:90px 1fr 38px;gap:8px;align-items:center;margin-bottom:5px}
.vel-name{font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar-bg{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.vbar-fill{height:100%;border-radius:3px}
.vpct{font-size:11px;font-weight:700;text-align:right}
.hist-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.hist-week{font-size:11px;font-weight:600;color:var(--text-2);min-width:170px}
.hist-bars{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.hbar{height:20px;border-radius:4px;padding:0 8px;font-size:10px;font-weight:600;display:flex;align-items:center;min-width:60px}
.loader{text-align:center;padding:50px;color:var(--text-3);font-size:13px}
.divider{height:1px;background:var(--border);margin:20px 0}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div><h1>Galston Clinic Tracker</h1><div class="hdr-sub" id="hdr-sub">Loading...</div></div>
    <button class="scan-btn" id="scan-btn" onclick="triggerScan()">Scan now</button>
  </div>
  <div class="summary" id="summary"></div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('current')">This week</button>
    <button class="tab" onclick="showTab('forward')">Next 4 weeks</button>
    <button class="tab" onclick="showTab('history')">History</button>
  </div>
  <div id="panel-current" class="panel active"><div class="loader">Loading...</div></div>
  <div id="panel-forward" class="panel"><div class="loader">Loading...</div></div>
  <div id="panel-history" class="panel"><div class="loader">Loading...</div></div>
</div>
<script>
var COL={galston:'#3266AD',bot:'#D85A30'};
var allScans=[];
function occ(b,c){return c>0?Math.round((b/c)*100):0;}
function occCol(v){return v>=75?'#C42B2B':v>=50?'#C47D00':v>=25?'#B56A00':'#3D9A22';}
function fmtTime(ts){return new Date(ts).toLocaleString('en-AU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
function fetchScans(){return fetch('/api/scans').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}
function triggerScan(){var btn=document.getElementById('scan-btn');btn.disabled=true;btn.textContent='Scanning...';fetch('/api/scan',{method:'POST'}).then(function(){return loadAll();}).catch(function(e){alert('Scan failed: '+e.message);}).finally(function(){btn.disabled=false;btn.textContent='Scan now';});}
function loadAll(){return fetchScans().then(function(scans){allScans=scans;if(!scans||!scans.length){document.getElementById('panel-current').innerHTML='<div class="loader">No scans yet</div>';document.getElementById('hdr-sub').textContent='No data yet';return;}var latest=scans[scans.length-1];document.getElementById('hdr-sub').textContent='Last scanned '+fmtTime(latest.ts)+' · '+scans.length+' scans · Every 30 min 24/7';renderSummary(latest);renderCurrentWeek(latest,scans);renderForwardWeeks(latest,scans);renderHistory(scans);}).catch(function(e){document.getElementById('panel-current').innerHTML='<div class="loader">Error: '+e.message+'</div>';});}
function renderSummary(latest){var week0=latest.weeks?latest.weeks[0]:latest;if(!week0)return;var html='';Object.entries(week0.clinics).forEach(function(ce){var key=ce[0],clinic=ce[1],tc=0,tb=0;Object.values(clinic.pracs).forEach(function(p){tc+=p.weekTotal.cap;tb+=p.weekTotal.booked;});var pct=occ(tb,tc),col=occCol(pct);html+='<span class="pill" style="color:'+col+';border-color:'+col+'33;background:'+col+'0d"><span class="pill-dot" style="background:'+COL[key]+'"></span>'+clinic.name.split(' ').slice(0,2).join(' ')+': '+pct+'%</span>';});document.getElementById('summary').innerHTML=html;}
function renderCurrentWeek(latest,allScans){var week0=latest.weeks?latest.weeks[0]:null;if(!week0){document.getElementById('panel-current').innerHTML='<div class="loader">No data</div>';return;}var ws=week0.weekStart;var weekScans=allScans.filter(function(s){return s.currentWeekStart===ws||(s.weeks&&s.weeks[0]&&s.weeks[0].weekStart===ws);});var html='';if(weekScans.length>1)html+=renderVelocity(weekScans);html+=renderWeekBlock(week0,weekScans.length,latest.ts,'current');document.getElementById('panel-current').innerHTML=html;}
function renderForwardWeeks(latest,allScans){if(!latest.weeks||latest.weeks.length<2){document.getElementById('panel-forward').innerHTML='<div class="loader">No forward data yet</div>';return;}var html='<p class="future-note">Shows slots already booked in advance. Lower numbers are normal for weeks further away. Watch this fill up over time.</p>';for(var i=1;i<latest.weeks.length;i++){var week=latest.weeks[i];var ws=week.weekStart;var wScans=allScans.filter(function(s){return s.weeks&&s.weeks.some(function(w){return w.weekStart===ws;});});if(wScans.length>1){var lw=wScans[wScans.length-1].weeks.find(function(w){return w.weekStart===ws;});if(lw)html+=renderFillTrend(lw,wScans.length);}html+=renderWeekBlock(week,wScans.length,latest.ts,'future');if(i<latest.weeks.length-1)html+='<div class="divider"></div>';}document.getElementById('panel-forward').innerHTML=html;}
function renderFillTrend(latestW,scanCount){var rows='';Object.entries(latestW.clinics).forEach(function(ce){var ck=ce[0],clinic=ce[1];Object.values(clinic.pracs).forEach(function(prac){if(!prac.weekTotal.cap)return;var p=prac.weekTotal.occ,col=COL[ck];rows+='<div class="vel-row"><span class="vel-name">'+prac.short+'</span><div class="vbar-bg"><div class="vbar-fill" style="width:'+p+'%;background:'+col+'"></div></div><span class="vpct" style="color:'+occCol(p)+'">'+p+'%</span></div>';});});if(!rows)return'';return'<div class="vel"><h3>Fill rate across '+scanCount+' scans</h3>'+rows+'</div>';}
function renderWeekBlock(week,scanCount,ts,type){var badge=type==='current'?'<span class="badge badge-current">current week</span>':type==='future'?'<span class="badge badge-future">+'+week.weekOffset+'w ahead</span>':'<span class="badge badge-past">past</span>';var html='<div class="week-block"><div class="week-hdr"><span class="week-title">'+week.weekLabel+'</span>'+badge+'<span class="scan-info">'+scanCount+' scan'+(scanCount!==1?'s':'')+' · latest '+fmtTime(ts)+'</span></div>';Object.entries(week.clinics).forEach(function(ce){html+=renderClinicGrid(ce[0],ce[1],week.dayLabels);});html+='</div>';return html;}
function renderClinicGrid(ck,clinic,dayLabels){var pracs=Object.values(clinic.pracs).filter(function(p){return p.weekTotal.cap>0;});if(!pracs.length)return'';var tc=0,tb=0;pracs.forEach(function(p){tc+=p.weekTotal.cap;tb+=p.weekTotal.booked;});var co=occ(tb,tc),col=COL[ck];var cols='130px repeat(7,1fr) 54px';var html='<div class="clinic-block"><div class="clinic-hdr"><span class="cdot" style="background:'+col+'"></span><span class="cname">'+clinic.name+'</span><span class="cocc">'+co+'% · '+tb+'/'+tc+'</span></div><div class="grid"><div class="grid-row hrow" style="grid-template-columns:'+cols+'"><div class="cell name-cell"><span class="dhdr">Practitioner</span></div>'+dayLabels.map(function(d){return'<div class="cell"><span class="dhdr">'+d+'</span></div>';}).join('')+'<div class="cell"><span class="dhdr">Week</span></div></div>';Object.values(clinic.pracs).forEach(function(prac){if(!prac.weekTotal.cap)return;var wOcc=prac.weekTotal.occ,wCol=occCol(wOcc);html+='<div class="grid-row" style="grid-template-columns:'+cols+'"><div class="cell name-cell"><div class="pname">'+prac.name+'</div><div class="prole">'+prac.role+'</div></div>';Object.values(prac.days).forEach(function(day){if(day.off||day.cap===0){html+='<div class="cell"><span class="dash">—</span></div>';}else if(day.booked===null){html+='<div class="cell"><span class="dash">?</span></div>';}else{var dc=occCol(day.occ);html+='<div class="cell" style="background:'+dc+'0d"><span class="occ" style="color:'+dc+'">'+day.occ+'%</span><span class="osub">'+day.booked+'/'+day.cap+'</span><div class="obar"><div class="ofill" style="width:'+day.occ+'%;background:'+dc+'"></div></div></div>';}});html+='<div class="cell" style="background:'+wCol+'0d"><span class="occ" style="color:'+wCol+'">'+wOcc+'%</span><span class="osub">'+prac.weekTotal.booked+'/'+prac.weekTotal.cap+'</span></div></div>';});html+='</div></div>';return html;}
function renderVelocity(weekScans){var latest=weekScans[weekScans.length-1];var week=latest.weeks?latest.weeks[0]:latest;if(!week)return'';var rows='';Object.entries(week.clinics).forEach(function(ce){var ck=ce[0],clinic=ce[1];Object.values(clinic.pracs).forEach(function(prac){if(!prac.weekTotal.cap)return;var p=prac.weekTotal.occ,col=COL[ck];rows+='<div class="vel-row"><span class="vel-name">'+prac.short+'</span><div class="vbar-bg"><div class="vbar-fill" style="width:'+p+'%;background:'+col+'"></div></div><span class="vpct" style="color:'+occCol(p)+'">'+p+'%</span></div>';});});if(!rows)return'';return'<div class="vel"><h3>Booking velocity · '+weekScans.length+' scans</h3>'+rows+'</div>';}
function renderHistory(scans){if(!scans||!scans.length){document.getElementById('panel-history').innerHTML='<div class="loader">No history yet</div>';return;}var byWeek={};scans.forEach(function(s){var ws=s.currentWeekStart||(s.weeks&&s.weeks[0]&&s.weeks[0].weekStart)||(s.weekStart);if(!ws)return;if(!byWeek[ws])byWeek[ws]=[];byWeek[ws].push(s);});var weeks=Object.keys(byWeek).sort().reverse();var html='';weeks.forEach(function(ws){var wScans=byWeek[ws],latest=wScans[wScans.length-1],week=latest.weeks?latest.weeks[0]:latest;if(!week)return;var tc=0,tb=0;Object.values(week.clinics).forEach(function(c){Object.values(c.pracs).forEach(function(p){tc+=p.weekTotal.cap;tb+=p.weekTotal.booked;});});var co=occ(tb,tc);html+='<div class="hist-row"><div class="hist-week">'+week.weekLabel+'<div style="font-size:10px;color:var(--text-3);margin-top:2px">'+wScans.length+' scan'+(wScans.length!==1?'s':'')+' · latest '+fmtTime(latest.ts)+'</div></div><div class="hist-bars">';Object.entries(week.clinics).forEach(function(ce){var ck=ce[0],clinic=ce[1],ctc=0,ctb=0;Object.values(clinic.pracs).forEach(function(p){ctc+=p.weekTotal.cap;ctb+=p.weekTotal.booked;});var cpct=occ(ctb,ctc),col=COL[ck];html+='<span class="hbar" style="background:'+col+'18;color:'+col+'">'+clinic.name.split(' ').slice(0,2).join(' ')+': '+cpct+'%</span>';});html+='</div><span style="font-size:13px;font-weight:700;color:'+occCol(co)+';min-width:36px;text-align:right">'+co+'%</span></div>';});document.getElementById('panel-history').innerHTML=html||'<div class="loader">No history</div>';}
function showTab(name){document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});document.getElementById('panel-'+name).classList.add('active');document.querySelector('.tab[onclick="showTab(\''+name+'\')"]').classList.add('active');}
window.showTab=showTab;window.triggerScan=triggerScan;window.loadAll=loadAll;
loadAll();
setInterval(loadAll,300000);
</script>
</body>
</html>
